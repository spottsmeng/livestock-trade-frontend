name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  a11y:
    runs-on: ubuntu-latest
    # §17.3 ("axe-core in CI on every page") — needs the real backend +
    # Postgres + Redis running, not just the frontend build, since the
    # suite logs in and exercises real screens. backend/ is a separate
    # repo (see [[separate-repos-not-monorepo]]), checked out alongside
    # this one — same owner, so the default GITHUB_TOKEN can read it as
    # long as it stays public; a private backend repo would need a PAT
    # with cross-repo read scope here instead.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: livestock
          POSTGRES_PASSWORD: livestock
          POSTGRES_DB: livestock
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U livestock"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          path: frontend

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: spottsmeng/livestock-trading-backend
          path: backend

      - name: Set up shared fixtures directory
        run: |
          mkdir -p fixtures
          cp backend/../frontend/../fixtures/* fixtures/ 2>/dev/null || true
        # The two repos share fixtures/reference-data-seed.json from the
        # parent working folder in local dev (see backend/core/config.py's
        # reference_data_seed_path comment) — CI has no such shared parent,
        # so backend/scripts/seed.py's REFERENCE_DATA_SEED_PATH env var
        # (set below) points it at backend's own copy instead.

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.7.19"

      - name: Set up Python
        run: uv python install
        working-directory: backend

      - name: Install backend dependencies
        run: uv sync --all-groups
        working-directory: backend

      - name: Run backend migrations
        env:
          DATABASE_URL: postgresql+asyncpg://livestock:livestock@localhost:5432/livestock
        run: uv run alembic upgrade head
        working-directory: backend

      - name: Seed dev accounts (bobby/bing/buyer)
        env:
          DATABASE_URL: postgresql+asyncpg://livestock:livestock@localhost:5432/livestock
        run: uv run python -m scripts.seed
        working-directory: backend

      - name: Export seeded MFA secrets for the a11y suite
        env:
          DATABASE_URL: postgresql+asyncpg://livestock:livestock@localhost:5432/livestock
        # Read directly from the DB rather than parsing scripts/seed.py's
        # printed output — seed.py generates a fresh TOTP secret every run,
        # so this must always reflect what was actually just seeded.
        run: |
          uv run python -c "
          import asyncio, os
          from sqlalchemy.ext.asyncio import create_async_engine
          from sqlalchemy import text

          async def main():
              engine = create_async_engine(os.environ['DATABASE_URL'])
              async with engine.connect() as conn:
                  result = await conn.execute(text(
                      \"SELECT email, mfa_secret FROM users WHERE email IN \"
                      \"('bobby@example.com','bing@example.com')\"
                  ))
                  secrets = dict(result.all())
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write(f\"BOBBY_MFA_SECRET={secrets['bobby@example.com']}\n\")
                  f.write(f\"BING_MFA_SECRET={secrets['bing@example.com']}\n\")

          asyncio.run(main())
          "
        working-directory: backend

      - name: Start backend
        env:
          DATABASE_URL: postgresql+asyncpg://livestock:livestock@localhost:5432/livestock
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-only-secret-not-used-anywhere-real
          DISABLE_BREACHED_PASSWORD_CHECK: "true"
          COOKIE_SECURE: "false"
          # Deliberately NOT overridden to false here (unlike local dev's
          # .env convenience flag) — CI exercises the real, spec-correct
          # §14 MFA-required login path, since it exports real TOTP
          # secrets below for exactly that purpose.
          CORS_ALLOWED_ORIGINS: "http://localhost:3000"
        run: |
          uv run fastapi run main.py --port 8000 &
          npx --yes wait-on http://localhost:8000/api/v1/health --timeout 60000
        working-directory: backend

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: frontend

      - name: Run axe-core a11y suite
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: pnpm test:a11y
        working-directory: frontend
